name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Public repository guard
        run: node scripts/check-public-repo.mjs
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
      - name: Run BNB reference example
        run: dart run example/main.dart
